<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sistema Gestor Engenharia">
  <!-- ============================================================
       MARCA DO APLICATIVO — Sistema Gestor Engenharia
       O símbolo da Gestor Engenharia, o mesmo da apresentação e do
       papel timbrado. Antes daqui morava a Av. Teotônio Vilela em
       perspectiva: fazia sentido quando o sistema era de uma obra só,
       e deixou de fazer quando ele virou o sistema da empresa (roda
       também Ruas de Terra e Ranário).

       A placa é CLARA porque a marca é bordô com um ponto preto — em
       fundo grafite o ponto desaparece e o bordô perde contraste. Aqui
       ela entra sem adaptação nenhuma.

       O símbolo vai embutido em base64 de propósito: o traço da órbita
       é uma curva de assinatura, não geometria que se redesenhe à mão
       sem descaracterizar a marca.
       ============================================================ -->
  <rect width="64" height="64" rx="14.5" fill="#f5f3ef"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.9" fill="none"
        stroke="#1a1612" stroke-opacity="0.10" stroke-width="1.5"/>
  <image x="9" y="16.91" width="46" height="30.19"
         href="data:image/png;base64,"/>
</svg>
