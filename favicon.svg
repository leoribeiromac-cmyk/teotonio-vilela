<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sistema Teotônio Vilela">
  <!-- ============================================================
       MARCA DO APLICATIVO — Av. Senador Teotônio Vilela
       A obra é a duplicação de uma avenida: a marca é a própria via
       em perspectiva, com a faixa central em fuga. Formas geométricas,
       dois tons, nenhum detalhe que suma no ícone de 16px da aba.
       Mesma gramática dos ícones de tela (js/ui/icones.js).
       ============================================================ -->
  <defs>
    <linearGradient id="tvPlaca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25201a"/>
      <stop offset="1" stop-color="#14120e"/>
    </linearGradient>
    <linearGradient id="tvPista" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e0783c"/>
      <stop offset="1" stop-color="#c25a26"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14.5" fill="url(#tvPlaca)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.9" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- a pista em fuga: larga na base, estreita no horizonte -->
  <path d="M17.4 52.5 L27.2 15.4 H36.8 L46.6 52.5 Z" fill="url(#tvPista)"/>

  <!-- faixa central seccionada, diminuindo com a distância -->
  <g fill="#fdf6ef">
    <rect x="29.4" y="43.6" width="5.2" height="7.2" rx="1.4"/>
    <rect x="30.05" y="32.4" width="3.9" height="5.6" rx="1.1"/>
    <rect x="30.6" y="23.6" width="2.8" height="4.2" rx="0.9"/>
    <rect x="31.05" y="17.2" width="1.9" height="3" rx="0.7"/>
  </g>
</svg>
